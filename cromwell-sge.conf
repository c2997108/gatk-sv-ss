# Cromwell ConfigBackend configuration for on-prem SGE + Singularity/Apptainer.
#
# Launch Cromwell from the repository root, or set GATKSV_SGE_BASEDIR to this
# repository path before launch. Container images are resolved under:
#   ${GATKSV_SGE_IMAGE_DIR:-$GATKSV_SGE_BASEDIR/images}
#
# This config intentionally avoids hard-coded site paths except for the default
# Singularity/Apptainer install path used on this cluster.

call-caching {
  enabled = true
}

system {
  file-hash-cache = true
}

docker {
  hash-lookup {
    enabled = false
  }
}

# Persist Cromwell metadata and call-cache entries across invocations. Without
# this, `cromwell run` uses the default in-memory HSQLDB and a failed rerun
# cannot reuse successful jobs from a previous Cromwell process.
database {
  profile = "slick.jdbc.PostgresProfile$"
  db {
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://localhost:5432/cromwell"
    user = "cromwell"
    password = "cromwellpw"
    connectionTimeout = 120000
    numThreads = 32
  }
}

backend {
  default = "SGE"
  providers {
    SGE {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        root = "cromwell-executions"

        filesystems {
          local {
            localization: ["soft-link", "hard-link", "copy"]
            docker.allow-soft-links: true
            caching {
              duplication-strategy: ["soft-link", "hard-link", "copy"]
              hashing-strategy: "fingerprint"
            }
          }
        }

        runtime-attributes = """
          Int cpu = 1
          Float memory_gb = 4
          String disks = "local-disk 10 HDD"
          Int bootDiskSizeGb = 10
          Int preemptible = 0
          Int maxRetries = 0
          Int max_retries = 0
          String? docker
        """

        submit = """
          basedir="$GATKSV_SGE_BASEDIR"
          if [ -z "$basedir" ]; then basedir="$PWD"; fi
          "$basedir"/submit-nonsingularity-job.sh "${memory_gb}" "${cpu}" "$basedir" "${job_name}" "${cwd}" "${out}" "${err}" "" "${docker}" "${script}"
        """

        submit-docker = """
          basedir="$GATKSV_SGE_BASEDIR"
          if [ -z "$basedir" ]; then basedir="$PWD"; fi
          singularitydir="$GATKSV_SINGULARITY_DIR"
          if [ -z "$singularitydir" ]; then singularitydir="/suikou/tool9-all/bin"; fi
          "$basedir"/submit-singularity-job.sh "${memory_gb}" "${cpu}" "$basedir" "${job_name}" "${cwd}" "${out}" "${err}" "$singularitydir" "${docker}" "${script}"
        """

        exit-code-timeout-seconds = 120
        job-id-regex = "(\\d+)"

        kill = "qdel ${job_id}"
        kill-docker = "qdel ${job_id}"

        check-alive = """
          basedir="$GATKSV_SGE_BASEDIR"
          if [ -z "$basedir" ]; then basedir="$PWD"; fi
          "$basedir"/check-alive.sh ${job_id}
        """

        # Keep scatter-heavy stages from saturating shared storage.
        concurrent-job-limit = 20
        maxRetries = 5
      }
    }
  }
}
